[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-linkcheck"
description = "Link Check plugin voor Alliance Auth — overzicht of leden goed gekoppeld zijn (CharLink + ESI-tokens)."
readme = "README.md"
keywords = [
    "allianceauth",
    "charlink",
    "compliance",
    "esi",
]
license = { file = "LICENSE" }
authors = [
    { name = "Dutch Legions" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "django-esi>=8",
    "aa-charlink>=1",
]

[tool.hatch]
version.path = "linkcheck/__init__.py"
build.include = [
    "/linkcheck",
]
